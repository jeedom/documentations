    es_ES: "Complemento para la recuperación de varios datos (ejp, vacante, santo del día ...) y el envío de varios datos (sms, correo), así como el intercambio de datos en la comunidad (temperatura, humedad...)"
    de_DE: "Plugin für die Wiederherstellung verschiedener Daten (ejp, Vakanz, Heiliger des Tages ...) und das Versenden verschiedener Daten (Sms, Mail) sowie das Teilen von Daten in der Community (Temperatur, Luftfeuchtigkeit)...)"

