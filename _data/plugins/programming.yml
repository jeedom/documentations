- id: clink
  name: "Click link"
  market_id: 1867
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Ce plugin permet la gestion de liens et d'évènements directement sur l'interface Jeedom. Vous pourrez, par exemple, créer une commande qui ouvre une modale (fenêtre de dialogue) avec une vue contenant vos caméras. Cela permet lorsque quelqu'un sonne chez vous d'afficher la caméra de l'entrée sur votre Jeedom."
    en_US: "This plugin allows the management of links and events directly on the Jeedom interface. You can, for example, create a command that opens a modal (dialog window) with a view containing your cameras. This allows when someone rings your doorbell to display the entrance camera on your Jeedom."
    es_ES: "Este complemento permite la gestión de enlaces y eventos directamente en la interfaz de Jeedom. Puede, por ejemplo, crear un comando que abra un modal (ventana de diálogo) con una vista que contenga sus cámaras. Esto permite que cuando alguien toca el timbre de la puerta se muestre la cámara de entrada en su Jeedom."
    de_DE: "Dieses Plugin ermöglicht die Verwaltung von Links und Ereignissen direkt auf der Jeedom-Oberfläche. Sie können beispielsweise einen Befehl erstellen, der ein Modal (Dialogfenster) mit einer Ansicht öffnet, die Ihre Kameras enthält. Dies ermöglicht es, wenn jemand an Ihrer Tür klingelt, die Eingangskamera auf Ihrem Jeedom anzuzeigen."

