- id: caldav
  name: "Agenda Caldav"
  market_id: 1149
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Auteur du plugin : Thomas Guenneguez. ATTENTION : il ne s'agit pas d'un plugin Officiel Jeedom mais d'un plugin développé par une tierce personne et dont l'évolution a été abandonnée. L'équipe technique Jeedom assurera l'assistance sur ce plugin sans obligation de résultat. Plugin pour lire les évènements d'un Agenda Caldav. Avec une expression régulière on peut, par exemple, extraire une température d'un évènement."
    en_US: "Plugin author : Thomas Guenneguez. Be careful : it is not an Official Jeedom plugin but a plugin developed by a third party and whose evolution has been abandoned. The Jeedom technical team will provide assistance with this plugin without obligation of result. Plugin to read events from a Caldav Calendar. With a regular expression we can, for example, extract a temperature from an event."
    es_ES: "Autor del complemento : Thomas Guenneguez. Atención : no es un complemento oficial de Jeedom sino un complemento desarrollado por un tercero y cuya evolución ha sido abandonada. El equipo técnico de Jeedom proporcionará asistencia con este complemento sin obligación de resultado. Complemento para leer eventos de un calendario Caldav. Con una expresión regular podemos, por ejemplo, extraer una temperatura de un evento."
    de_DE: "Plugin Autor : Thomas Guenneguez. Achtung : Es ist kein offizielles Jeedom-Plugin, sondern ein Plugin, das von einem Dritten entwickelt wurde und dessen Entwicklung aufgegeben wurde. Das technische Team von Jeedom wird dieses Plugin ohne Ergebnisverpflichtung unterstützen. Plugin zum Lesen von Ereignissen aus einem Caldav-Kalender. Mit einem regulären Ausdruck können wir beispielsweise eine Temperatur aus einem Ereignis extrahieren."

