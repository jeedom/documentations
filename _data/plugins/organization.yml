- id: dataexport
  name: "Data Export"
  market_id: 4057
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Plugin permettant d'archiver des exports d'historiques ou de statistiques vers un fichier CSV. Il est possible d'automatiser la réception de fichiers d'export sur le canal de son choix via scénario ou programmation.<br/><br/>Le plugin permet également d'importer des données dans Jeedom depuis un fichier CSV vers une commande de type Info."
    en_US: "Plugin allowing to archive historical or statistics exports to a CSV file. It is possible to automate the reception of export files on the channel of your choice via scenario or programming.<br/><br/>The plugin also allows you to import data into Jeedom from a CSV file to an Info type control."
    es_ES: "Complemento que permite archivar exportaciones históricas o estadísticas a un archivo CSV. Es posible automatizar la recepción de archivos de exportación en el canal de su elección a través de escenario o programación.<br/><br/>El complemento también le permite importar datos a Jeedom desde un archivo CSV a un control de tipo de información."
    de_DE: "Plugin zum Archivieren von historischen oder statistischen Exporten in eine CSV-Datei. Es ist möglich, den Empfang von Exportdateien auf dem Kanal Ihrer Wahl über ein Szenario oder eine Programmierung zu automatisieren.<br/><br/>Mit dem Plugin können Sie auch Daten aus einer CSV-Datei in ein Info-Steuerelement in Jeedom importieren."

