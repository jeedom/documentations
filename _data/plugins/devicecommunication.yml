- id: blink1
  name: "Blink (1)"
  market_id: 1244
  doc:
    stable: true
    beta: false
  changelog:
    stable: true
    beta: false
  description:
    fr_FR: "Ce plugin permet de contrôler une clé Blink1 depuis votre Jeedom. Ainsi vous pourrez depuis Jeedom faire changer la couleur de votre clé au grès de votre humeur ou pour vous notifier d'une alerte par exemple. <br/><br/><br/> Il faut installer sur un poste windows ou mac le logiciel Blink1 Control : https://github.com/todbot/blink1/releases et dans les options activer l'api server en mode &quot;any&quot;.<br/><br/>Vous pouvez aussi configurer une url de surveillance (l'url est indiqué sur la page de configuration de l'équipement blink1). "
