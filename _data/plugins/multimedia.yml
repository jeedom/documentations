- id: squeezeboxcontrol
  name: "SqueezeBox Control"
  market_id: 1710
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Ce plugin vous permet de contrôler vos Squeezebox.Il fait de l'autodecouverte, il attribue vos squeezebox aux bons objets si elles contiennent le nom de l'objet.Il permet aussi une gestion complète multidirectionnelle de la synchro. La possibilité de synchroniser toutes les squeezebox en un clic, toutes les allumer, toutes les éteindre etc.... Une fonction TTS est aussi disponibleUn panel dédié simple (mais qui va vouloir devenir très complet) est aussi disponible.De nombreuses autres fonctions sont aussi présentes"
    en_US: "This plugin allows you to control your Squeezebox.It makes self-discovery, it assigns your squeezebox to the right objects if they contain the name of the object.It also allows complete multidirectional synchro management. The possibility of synchronizing all squeezeboxes in one click, turning them all on, turning them off, etc. A TTS function is also available A simple dedicated panel (but which will want to become very complete) is also available.Many other functions are also present"
    es_ES: "Este complemento le permite controlar su Squeezebox.Hace autodescubrimiento, asigna su squeezebox a los objetos correctos si contienen el nombre del objeto.También permite una gestión sincronizada multidireccional completa. La posibilidad de sincronizar todos los squeezeboxes con un solo clic, encenderlos, apagarlos, etc. También está disponible una función TTS. También está disponible un panel dedicado simple (pero que querrá ser muy completo).Muchas otras funciones también están presentes"
    de_DE: "Mit diesem Plugin können Sie Ihre Squeezebox steuern.Es macht Selbstfindung, es weist Ihre Squeezebox den richtigen Objekten zu, wenn sie den Namen des Objekts enthalten.Es ermöglicht auch eine vollständige multidirektionale Synchronisationsverwaltung. Die Möglichkeit, alle Squeezeboxen mit einem Klick zu synchronisieren, alle einzuschalten, auszuschalten usw. Eine TTS-Funktion ist ebenfalls verfügbar. Ein einfaches dediziertes Bedienfeld (das jedoch sehr vollständig werden soll) ist ebenfalls verfügbar.Viele andere Funktionen sind ebenfalls vorhanden"
