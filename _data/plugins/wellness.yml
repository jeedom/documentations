  description:
    fr_FR: "Ce plugin très puissant et très complet vous permettra de gérer finement la température de votre logement que ce soit pour réchauffer ou refroidir celui-ci. Le plugin apprend de lui même avec le temps le meilleur moyen d'économiser de l'énergie tout en maintenant un confort optimal dans votre logement."
    en_US: "This very powerful and very complete plugin will allow you to finely manage the temperature of your accommodation, whether to heat or cool it. The plugin learns by itself the best way to save energy over time while maintaining optimal comfort in your home."
    es_ES: "Este complemento muy potente y muy completo le permitirá administrar con precisión la temperatura de su alojamiento, ya sea para calentarlo o enfriarlo. El complemento aprende con el tiempo la mejor manera de ahorrar energía mientras mantiene la comodidad óptima en su hogar."
    de_DE: "Mit diesem sehr leistungsstarken und sehr vollständigen Plugin können Sie die Temperatur Ihrer Unterkunft genau steuern, unabhängig davon, ob Sie sie heizen oder kühlen möchten. Das Plugin lernt im Laufe der Zeit, wie Sie am besten Energie sparen und gleichzeitig den optimalen Komfort in Ihrem Zuhause gewährleisten können."

