- id: beagle
  name: "Odace SFSP"
  market_id: 3917
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Plugin ajoutant le support de la gamme Odace SFSP (sans fil sans pile) Schneider à Jeedom. Il permet d'obtenir les informations des interrupteurs (volets/ scènes / simple / double). Il permet de contrôler les actionneurs (volet/dcl). Il permet aussi de pouvoir utiliser les scènes et les groupes."
    en_US: "Plugin adding support for the Odace SFSP range (wireless without battery) Schneider to Jeedom. It allows to obtain the information of the switches (shutters / scenes / single / double). It allows to control the actuators (shutter / dcl). It also allows you to use scenes and groups."
    es_ES: "Complemento que agrega soporte para la gama Odace SFSP (inalámbrica sin batería) Schneider a Jeedom. Permite obtener la información de los interruptores (persianas / escenas / individuales / dobles). Permite controlar los actuadores (obturador / dcl). También te permite usar escenas y grupos."
    de_DE: "Plugin zur Unterstützung der Odace SFSP-Reihe (drahtlos ohne Akku) Schneider to Jeedom. Es ermöglicht die Information der Schalter (Fensterläden / Szenen / Einzel / Doppel). Es ermöglicht die Steuerung der Aktuatoren (Verschluss / dcl). Außerdem können Sie Szenen und Gruppen verwenden."

- id: blea
  name: "Bluetooth Advertisement"
  market_id: 2554
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Plugin pour la gestion de certains devices qui fonctionnent en bluetooth advertisement comme les NIUS de Nodon Pour les NIUS il permet de detecter les différents appuis. Pour certains autres devices il permet de faire de la présence. Aussi compatible avec les boutons ticatag (avec gestion des multiples appuis température et action pour le faire sonner) Compatible Mi flora, Mi scale , awox smartplug, playbulb, miband1 et 1s"
    en_US: "Plugin for the management of certain devices which work in bluetooth advertisement like the NIUS of Nodon For the NIUS it allows to detect the different supports. For some other devices it allows to make presence. Also compatible with ticatag buttons (with management of multiple temperature and action presses to make it ring) Compatible Mi flora, Mi scale, awox smartplug, playbulb, miband1 and 1s"
    es_ES: "Plugin para la gestión de determinados dispositivos que funcionan en publicidad bluetooth como el NIUS de Nodon Para el NIUS permite detectar los diferentes soportes. Para algunos otros dispositivos permite hacer presencia. También compatible con botones ticatag (con gestión de múltiples pulsaciones de temperatura y acción para que suene) Compatible Mi flora, Mi scale, awox smartplug, playbulb, miband1 y 1s"
    de_DE: "Plugin zur Verwaltung bestimmter Geräte, die in Bluetooth-Werbung funktionieren, wie der NIUS von Nodon Für den NIUS können die verschiedenen Unterstützungen erkannt werden. Bei einigen anderen Geräten ist Präsenz möglich. Kompatibel auch mit Ticatag-Tasten (mit der Verwaltung mehrerer Temperatur- und Aktionstasten, damit es klingelt) Kompatible Mi-Flora, Mi-Skala, Awox-Smartplug, Playbulb, Miband1 und 1s"

