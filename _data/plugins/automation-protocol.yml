  description:
    fr_FR: "Ce plugin va vous permettre d'intégrer une multitude de modules ZigBee (Ikea, Philips Hue, Xiaomi etc...) sans avoir a passer par leur passerelle avec la clé Conbee/Conbee II. IMPORTANT : il faut absolument une clef conbee pour utiliser ce plugin. Autre point il faut bien lire la documentation et les modules compatibles."
