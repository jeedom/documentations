- id: blea
  name: "Bluetooth Advertisement"
  market_id: 2554
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Plugin pour la gestion de certains devices qui fonctionnent en bluetooth advertisement comme les NIUS de Nodon Pour les NIUS il permet de detecter les différents appuis. Pour certains autres devices il permet de faire de la présence. Aussi compatible avec les boutons ticatag (avec gestion des multiples appuis température et action pour le faire sonner) Compatible Mi flora, Mi scale , awox smartplug, playbulb, miband1 et 1s"
    en_US: "Plugin for the management of certain devices which work in bluetooth advertisement like the NIUS of Nodon For the NIUS it allows to detect the different supports. For some other devices it allows presence. Also compatible with ticatag buttons (with management of multiple temperature and action presses to make it ring) Compatible Mi flora, Mi scale, awox smartplug, playbulb, miband1 and 1s"
    es_ES: "Complemento para la gestión de ciertos dispositivos que funcionan en publicidad bluetooth como el NIUS de Nodon. Para el NIUS permite detectar los diferentes soportes. Para algunos otros dispositivos, permite la presencia. También compatible con botones ticatag (con gestión de múltiples prensas de temperatura y acción para que suene) Compatible Mi flora, Mi scale, awox smartplug, playbulb, miband1 y 1s"
    de_DE: "Plugin pour la gestion de certains devices qui fonctionnent en bluetooth advertisement comme les NIUS de Nodon Pour les NIUS il permet de detecter les différents appuis. Pour certains autres devices il permet de faire de la présence. Aussi compatible avec les boutons ticatag (avec gestion des multiples appuis température et action pour le faire sonner) Compatible Mi flora, Mi scale , awox smartplug, playbulb, miband1 et 1s"
