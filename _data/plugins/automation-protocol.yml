    de_DE: "Mit diesem Plugin können Sie eine Vielzahl von ZigBee-Modulen (Ikea, Philips Hue, Xiaomi usw.) integrieren, ohne das Gateway mit dem Conbee / Conbee II-Schlüssel durchlaufen zu müssen. WICHTIG : Sie benötigen unbedingt einen Conbee-Schlüssel, um dieses Plugin zu verwenden. Ein weiterer Punkt ist das Lesen der Dokumentation und der kompatiblen Module."

