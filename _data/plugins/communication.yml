- id: mobile
  name: "App Mobile"
  market_id: 2030
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "L'app V2 nécessite Android14 ou IOS 12.4 minimum. <br/><br/>Attention, l'app v1 n'est pas compatible avec le dernier Android. L'application officielle Jeedom permet le pilotage de votre système domotique Jeedom, que ce soit en Wifi local, ou sur le réseau 4G/%G de votre opérateur. <br/><br/>L'app se connecte automatiquement à votre Jeedom avec une initialisation automatique par QRcode, aucune configuration n'est nécessaire. (possibilité de le faire manuellement)<br/>Vous retrouverez sur votre mobile toutes les fonctionnalités de votre Jeedom.<br/>Vous pourrez personnaliser votre application avec des raccourcis et plus encore...<br/><br/>Fonctionnalités actuelles:<br/>- Gestion de vos scénarios.<br/>- Gestion de votre domotique en fonction de vos pièces et équipements.<br/>- Maj et retour d'état automatique - Interface personnalisable avec les raccourcis Notifications (avec prise en charge du ASK<br/>D'autres fonctionnalités et compatibilités sont à venir dans les prochaines mises à jour !<br/><br/>Respect de la vie privée.<br/>Aucune donnée (domotique ou personnelle) n'est stockée ou conservée sur nos serveurs."
    en_US: "L'app V2 nécessite Android14 ou IOS 12.4 minimum. <br/><br/>Attention, l'app v1 n'est pas compatible avec le dernier Android. L'application officielle Jeedom permet le pilotage de votre système domotique Jeedom, que ce soit en Wifi local, ou sur le réseau 4G/%G de votre opérateur. <br/><br/>The app automatically connects to your Jeedom with automatic initialization by QRcode, no configuration is necessary. (possibility to do it manually)<br/>You will find all the features of your Jeedom on your mobile.<br/>You will be able to customize your application with shortcuts and more...<br/><br/>Current features:<br/>- Managing your scenarios.<br/>- Management of your home automation according to your parts and equipment.<br/>- Maj et retour d'état automatique - Interface personnalisable avec les raccourcis Notifications (avec prise en charge du ASK<br/>Other features and compatibilities are coming in the next updates !<br/><br/>Respect for private life.<br/>No data (home automation or personal) is stored or kept on our servers."
    es_ES: "L'app V2 nécessite Android14 ou IOS 12.4 minimum. <br/><br/>Attention, l'app v1 n'est pas compatible avec le dernier Android. L'application officielle Jeedom permet le pilotage de votre système domotique Jeedom, que ce soit en Wifi local, ou sur le réseau 4G/%G de votre opérateur. <br/><br/>La aplicación se conecta automáticamente a su Jeedom con inicialización automática mediante QRcode, no es necesaria ninguna configuración. (posibilidad de hacerlo manualmente)<br/>Encontrarás todas las funcionalidades de tu Jeedom en tu móvil.<br/>Podrás personalizar tu aplicación con atajos y más...<br/><br/>Funciones actuales:<br/>- Gestionar sus escenarios.<br/>- Gestión de su domótica según sus piezas y equipos.<br/>- Maj et retour d'état automatique - Interface personnalisable avec les raccourcis Notifications (avec prise en charge du ASK<br/>Otras funciones y compatibilidades vendrán en las próximas actualizaciones !<br/><br/>Respeto a la vida privada.<br/>No se almacenan ni guardan datos (domóticos o personales) en nuestros servidores."
    de_DE: "L'app V2 nécessite Android14 ou IOS 12.4 minimum. <br/><br/>Attention, l'app v1 n'est pas compatible avec le dernier Android. L'application officielle Jeedom permet le pilotage de votre système domotique Jeedom, que ce soit en Wifi local, ou sur le réseau 4G/%G de votre opérateur. <br/><br/>Die App stellt automatisch eine Verbindung zu Ihrem Jeedom mit automatischer Initialisierung per QRcode her. Eine Konfiguration ist nicht erforderlich. (Möglichkeit, es manuell zu tun)<br/>Sie finden alle Funktionen Ihres Jeedom auf Ihrem Handy.<br/>Sie können Ihre Anwendung mit Verknüpfungen und mehr anpassen...<br/><br/>Aktuelle Funktionen:<br/>- Verwalten Ihrer Szenarien.<br/>- Management Ihrer Hausautomation nach Ihren Teilen und Geräten.<br/>- Maj et retour d'état automatique - Interface personnalisable avec les raccourcis Notifications (avec prise en charge du ASK<br/>Weitere Funktionen und Kompatibilitäten werden in den nächsten Updates verfügbar sein !<br/><br/>Respekt für das Privatleben.<br/>Auf unseren Servern werden keine Daten (Heimautomation oder persönliche Daten) gespeichert oder gespeichert."

