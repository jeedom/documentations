    beta: false
  description:
    fr_FR: "Plugin pour contrôller votre Nimbus.<br/><br/>Vous pouvez controller le texte affiché, la position des aiguilles. Le tout via scénario ou via le dashboard.<br/><br/>Une représentation personnalisable du nimbus sur votre dash viendra aggrémenter le tout<br/><br/>Le dashboard est complétement personnalisable<br/><br/>Vous pouvez changer la position de chaque aiguille et changer le texte de chaque écran indépendammment (soit via le dashboard soit via scénario)<br/><br/>Il existe aussi une commande démo ainsi qu'une commande tous (pour agir sur tous les écrans en meme temps) ,ainsi qu'une commande phrase pour splitter une phrase sur les 4 écrans.<br/><br/><br/>Bien lire la documentation"
    en_US: "Plugin to control your Nimbus.<br/><br/>You can control the displayed text, the position of the hands. All via scenario or via the dashboard.<br/><br/>A customizable representation of the nimbus on your dash will enhance the whole<br/><br/>The dashboard is completely customizable<br/><br/>You can change the position of each needle and change the text of each screen independently (either via the dashboard or via scenario)<br/><br/>There is also a demo command and an all command (to act on all screens at the same time), as well as a phrase command to split a phrase on the 4 screens.<br/><br/><br/>Read the documentation"
    es_ES: "Plugin para controlar tu Nimbus.<br/><br/>Puede controlar el texto mostrado, la posición de las manos. Todo a través del escenario o el tablero.<br/><br/>Una representación personalizable del nimbo en su tablero mejorará todo<br/><br/>El tablero de instrumentos es completamente personalizable<br/><br/>Puede cambiar la posición de cada aguja y cambiar el texto de cada pantalla de forma independiente (ya sea a través del tablero o a través de un escenario)<br/><br/>También hay un comando de demostración y un comando de todos (para actuar en todas las pantallas al mismo tiempo), así como un comando de frase para dividir una frase en las 4 pantallas.<br/><br/><br/>Lee la documentación"
    de_DE: "Plugin zur Steuerung Ihres Nimbus.<br/><br/>Sie können den angezeigten Text und die Position der Hände steuern. Alles über das Szenario oder über das Dashboard.<br/><br/>Eine anpassbare Darstellung des Nimbus auf Ihrem Armaturenbrett verbessert das Ganze<br/><br/>Das Dashboard ist vollständig anpassbar<br/><br/>Sie können die Position jeder Nadel und den Text jedes Bildschirms unabhängig voneinander ändern (entweder über das Dashboard oder über das Szenario)<br/><br/>Es gibt auch einen Demo-Befehl und einen All-Befehl (um auf allen Bildschirmen gleichzeitig zu agieren), sowie einen Phrasenbefehl, um eine Phrase auf den 4 Bildschirmen zu teilen.<br/><br/><br/>Lesen Sie die Dokumentation"

