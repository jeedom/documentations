- id: sunshutter
  name: "Gestion Volets"
  market_id: 3793
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Ce plugin va vous permettre de gérer facilement le positionnement automatique de vos volets en fonction du soleil et/ou d'autres conditions. IMPORTANT : ce plugin ne fonctionne qu'avec des équipements possédant une commande action/curseur permettant de positionner le volet à un certain pourcentage d'ouverture/fermeture."
    en_US: "This plugin will allow you to easily manage the automatic positioning of your shutters according to the sun and/or other conditions. Important : this plugin only works with equipment that has an action/cursor command allowing the shutter to be positioned at a certain opening/closing percentage."
    es_ES: "Este complemento le permitirá administrar fácilmente el posicionamiento automático de sus persianas según el sol y/u otras condiciones. Importante : este complemento solo funciona con equipos que tienen un comando de acción/cursor que permite posicionar la persiana en un cierto porcentaje de apertura/cierre."
    de_DE: "Mit diesem Plugin können Sie die automatische Positionierung Ihrer Rollläden je nach Sonne und/oder anderen Bedingungen einfach verwalten. Wichtig : Dieses Plugin funktioniert nur mit Geräten, die über einen Aktions-/Cursorbefehl verfügen, mit dem der Verschluss bei einem bestimmten Öffnungs-/Schließprozentsatz positioniert werden kann."

