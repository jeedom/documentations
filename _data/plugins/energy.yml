    beta: true
  description:
    fr_FR: "Créez des compteurs énergétiques sur mesure (tarif unique ou heures pleines/heures creuses) à partir d'indexs bruts (Wh/kWh) et/ou de puissances (W/kW). Permet également de créer des compteurs liés à une identification (Personnalisé/OCPP)."
