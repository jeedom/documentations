    es_ES: "Cree contadores de energía a medida (tarifa única u horas punta/valle) a partir de índices brutos (Wh/kWh) y/o potencias (W/kW). También permite la creación de contadores vinculados a un identificador (Personalizado/OCPP))."
    de_DE: "Erstellen Sie maßgeschneiderte Energiezähler (Einzeltarif oder Spitzen-/Nebenzeiten) aus Rohindizes (Wh/kWh) und/oder Leistungen (W/kW). Es ermöglicht auch die Erstellung von Zählern, die mit einer Kennung verknüpft sind (Custom/OCPP))."

- id: mpower
