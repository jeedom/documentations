- id: wescontrol
  name: "Wes Control"
  market_id: 4151
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Prenez le contrôle de votre serveur d'énergie Cartelectronic Wes depuis Jeedom et vous serez en mesure d'en décupler les fonctionnalités. Le plugin offre la possibilité d'utiliser un fichier CGX spécialement conçu pour Jeedom et permettant de lire davantage de données que celles disponibles par défaut (nécessite un accès au serveur Wes en FTP). (Firmware V0.84A10 minimum)"
    en_US: "Take control of your Cartelectronic Wes energy server from Jeedom and you will be able to increase its functionality tenfold. The plugin offers the possibility of using a CGX file specially designed for Jeedom and allowing to read more data than those available by default (requires access to the Wes server in FTP). (Firmware V0.84A10 minimum)"
    es_ES: "Toma el control de tu servidor de energía Cartelectronic Wes de Jeedom y podrás multiplicar por diez su funcionalidad. El complemento ofrece la posibilidad de usar un archivo CGX especialmente diseñado para Jeedom y que permite leer más datos que los disponibles por defecto (requiere acceso al servidor Wes en FTP). (Firmware V0.84A10 mínimo)"
    de_DE: "Übernehmen Sie die Kontrolle über Ihren Cartelectronic Wes Energieserver von Jeedom und Sie können seine Funktionalität verzehnfachen. Das Plugin bietet die Möglichkeit, eine speziell für Jeedom entwickelte CGX-Datei zu verwenden und mehr Daten als die standardmäßig verfügbaren zu lesen (erfordert Zugriff auf den Wes-Server in FTP). (Firmware V0.84A10 Mindestanforderung)"

