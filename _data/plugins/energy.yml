    fr_FR: "Ce plugin permet de contrôler vos multiprises Mpower. Le widget permet de voir toutes les infos : état, puissance, consommation, courant, voltage et facteur de puissance. Les données sont rafraichies toutes les minutes et après une action depuis jeedom. Uniquement testé avec le modèle 6 prises."
    en_US: "This plugin allows you to control your Mpower multiple sockets. The widget allows you to see all the info : status, power, consumption, current, voltage and power factor. The data is refreshed every minute and after an action from jeedom. Only tested with the 6 socket model."
    es_ES: "Este complemento le permite controlar sus múltiples enchufes Mpower. El widget te permite ver toda la información : estado, potencia, consumo, corriente, voltaje y factor de potencia. Los datos se actualizan cada minuto y después de una acción de jeedom. Solo probado con el modelo de 6 enchufes."
    de_DE: "Mit diesem Plugin können Sie Ihre Mpower-Mehrfachbuchsen steuern. Mit dem Widget können Sie alle Informationen anzeigen : Status, Leistung, Verbrauch, Strom, Spannung und Leistungsfaktor. Die Daten werden jede Minute und nach einer Aktion von jeedom aktualisiert. Nur mit dem 6-Sockel-Modell getestet."

