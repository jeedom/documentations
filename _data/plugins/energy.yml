- id: enedis
  name: "Enedis"
  market_id: 4036
  doc:
    stable: true
    beta: true
  changelog:
    stable: true
    beta: true
  description:
    fr_FR: "Récupérez les informations de consommation de vos compteurs électriques communicants à partir de votre compte-client Enedis. Tout ce qu'il faut faire est d'autoriser le partage des données avec Jeedom et d'indiquer le numéro d'identification du Point de Livraison (PDL) concerné. <br/><br/>Le plugin remonte les mesures horaire, journalière, mensuelle, annuelle ainsi que la puissance max aussi bien en consommation qu'en production. <br/>NB: Les données les plus récentes reçues par Enedis sont relatives à la veille du jour en cours"
    en_US: "Retrieve the consumption information of your smart electricity meters from your Enedis customer account. All you need to do is authorize data sharing with Jeedom and indicate the identification number of the Delivery Point (PDL) concerned. <br/><br/>The plugin reports hourly, daily, monthly, annual measurements as well as the maximum power both in consumption and in production. <br/>NB: The most recent data received by Enedis relate to the day before the current day"
    es_ES: "Recupere la información de consumo de sus contadores de electricidad inteligentes de su cuenta de cliente de Enedis. Todo lo que necesita hacer es autorizar el intercambio de datos con Jeedom e indicar el número de identificación del Punto de Entrega (PDL) en cuestión. <br/><br/>El plugin reporta mediciones horarias, diarias, mensuales, anuales así como la potencia máxima tanto en consumo como en producción. <br/>NB: Los datos más recientes recibidos por Enedis se refieren al día anterior al día actual"
    de_DE: "Rufen Sie die Verbrauchsinformationen Ihrer intelligenten Stromzähler von Ihrem Enedis-Kundenkonto ab. Sie müssen lediglich die Datenfreigabe mit Jeedom autorisieren und die Identifikationsnummer des betreffenden Lieferpunkts (Delivery Point, PDL) angeben. <br/><br/>Das Plugin meldet stündliche, tägliche, monatliche, jährliche Messungen sowie die maximale Leistung sowohl im Verbrauch als auch in der Produktion. <br/>NB: Die neuesten bei Enedis eingegangenen Daten beziehen sich auf den Tag vor dem aktuellen Tag"

