  changelog:
    stable:
      fr_FR: "https://anthonydomotique.github.io/jeedom_docs/MeteoFull_plugin/changelog.html"
    beta: false
  description:
    fr_FR: "Le plugin est le fruit de la réalisation du widget MeteoFull. De ce fait, le manque de fonctionnalités, de commandes pour son utilisation dans les scénarios, ... a fait naître l'obligation de développer ce plugin. Il permettra de faire tout ce que le widget faisait, à savoir bénéficier de la météo quotidienne et heure par heure pour 5 jours, mais également d'obtenir des statistiques, une personnalisation toujours plus poussée, ... Il a été développé à trois, jcamus86, jvanoost et AnthonyDomotique. Les données sont récupérées depuis l'api de https://www.prevision-meteo.ch/ pour la plupart des données et pour la zone géographique (France, Belgique, Suisse).Les autres données pour cette zone géographique, viennent de https://meteofrance.com/ ou sont calculées directement. N'hésitez pas à me suivre sur Twitter : https://twitter.com/AnthonyDomotiq"
