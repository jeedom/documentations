  changelog:
    stable:
      fr_FR: "https://jpty.github.io/jeedom/plugins/weatherForecast/fr_FR/changelog.html"
    beta:
      fr_FR: "https://jpty.github.io/jeedom/plugins/weatherForecast/fr_FR/changelog.html"
  description:
    fr_FR: "Ce plugin permet de récupérer la météo actuelle et les prévisions météorologiques sur quelques jours en utilisant les sources Météo France, OpenWeather ou WeatherAPI. Les alertes météos de Meteoalarm ou Météo France sont aussi récupérées. Un widget est fourni permettant d'afficher la météo sous une horloge similaire à celle du plugin horlogeHTC."
    en_US: "This plugin allows you to retrieve the current weather and the weather forecast for a few days using Météo France, OpenWeather or WeatherAPI sources. Weather alerts from Meteoalarm or Météo France are also retrieved. A widget is provided to display the weather under a clock similar to that of the horlogeHTC plugin."
    de_DE: "Dieses Plugin ermöglicht das Abrufen des aktuellen Wetters und der Wettervorhersage für einige Tage unter Verwendung von OpenWeather- oder WeatherAPI-Quellen. Auch Wetterwarnungen von Meteoalarm oder Météo France werden abgerufen. Es steht ein Widget zur Verfügung, um das Wetter unter einer Uhr anzuzeigen, ähnlich dem Plugin horlogeHTC."
    es_ES: "Este complemento permite recuperar el clima actual y el pronóstico del tiempo para algunos días utilizando fuentes OpenWeather o WeatherAPI. También se recuperan alertas meteorológicas de Meteoalarm o Météo France. Se proporciona un widget para mostrar el clima debajo de un reloj similar al complemento horlogeHTC."
