    beta: false
  changelog:
    stable:
      fr_FR: "https://scanab.github.io/jeedom-plugin-vmcAuto/fr_FR/changelog"
    beta: false
  description:
    fr_FR: "Plugin permettant la gestion de la vitesse d'une VMC en fonction de la pression athmosphérique, de la températures et du taux d'humidité. Le plugin calcule la concentration (en g/m3) d'eau dans l'air extérieur et la compare à celle de l'air intérieur afin de savoir si il faut déclencher la ventilation. Le plugin fonctionne idéalement avec une VMC commandable par Jeedom (marche / arret ou vitesse 1 / vitesse 2), mais peut aussi servir pour déclencher des alertes demandant d'aérer (cf. doc)."
