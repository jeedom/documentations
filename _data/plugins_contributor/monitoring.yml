      en_US: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/en_US/changelog"
      es_ES: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/es_ES/changelog"
      de_DE: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/de_DE/changelog"
    beta:
      fr_FR: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/fr_FR/changelog_beta"
      en_US: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/en_US/changelog_beta"
      es_ES: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/es_ES/changelog_beta"
      de_DE: "https://bernard-dandrea.github.io/documentation/jeedom-archiplus/doc/de_DE/changelog_beta"
  description:
    fr_FR: "La fonction principale du plugin est de fournir un ensemble complet d'outils permettant :<br/><br/>- de gérer les paramètres d'archivage des commandes de type INFO<br/>- de visualiser les volumes de données et de détecter les anomalies<br/>- d'insérer facilement des données historiques à partir de fichiers de type Excel<br/>- de récupérer les historiques à partir des archives Jeedom<br/>- d'étendre les options d'archivage standard de Jeedom<br/><br/>L'activation optionnelle de l'archivage intégré au plugin permet d'étendre très significativement les fonctions d'archivage proposées par Jeedom."
    en_US: "The plugin's main function is to provide a comprehensive set of tools that allow you to:<br/><br/>- manage archiving settings for INFO-type commands<br/>- view data volumes and detect anomalies<br/>- easily import historical data from Excel-type files<br/>- retrieve historical data from Jeedom archives<br/>- extend Jeedom's standard archiving options<br/><br/>Optionally enabling the plugin's built-in archiving feature significantly expands the archiving capabilities offered by Jeedom."
    es_ES: "La función principal del complemento es proporcionar un conjunto completo de herramientas que permiten:<br/><br/>- gestionar los parámetros de archivo de los comandos de tipo INFO<br/>- visualizar los volúmenes de datos y detectar anomalías<br/>- introducir fácilmente datos históricos a partir de archivos de tipo Excel<br/>- recuperar los historiales de los archivos de Jeedom<br/>- ampliar las opciones de archivo estándar de Jeedom<br/><br/>La activación opcional del archivo integrado en el complemento permite ampliar de forma muy significativa las funciones de archivo que ofrece Jeedom."
    de_DE: "Die Hauptfunktion des Plugins besteht darin, eine umfassende Palette an Tools bereitzustellen, mit denen Folgendes möglich ist:<br/><br/>- die Archivierungseinstellungen für Befehle vom Typ INFO zu verwalten<br/>- Datenmengen zu visualisieren und Anomalien zu erkennen<br/>- das einfache Einfügen historischer Daten aus Excel-Dateien<br/>- das Abrufen von Verlaufsdaten aus den Jeedom-Archiven<br/>- die Erweiterung der Standard-Archivierungsoptionen von Jeedom<br/><br/>Durch die optionale Aktivierung der im Plugin integrierten Archivierung lassen sich die von Jeedom angebotenen Archivierungsfunktionen erheblich erweitern."

