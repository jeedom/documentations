  description:
    fr_FR: "Plugin permettant la gestion d'un serveur Proxmox. Il est possible de récupérer toutes les ressources (noeuds, machine virtuelles, stockage...) et toutes leurs propriétés (statut, mémoire, CPU, disque, adresse IP, temps d'activité, list des snapshots...). Le plugin permet aussi de démarrer et arrêter les VMs et les containers ainsi que de prendre des snapshots et des backups. Il dispose également d'une page santé spécifique résumant l'ensemble des informations de vos équipements."
    en_US: "Plugin for Proxmox server management. All resources (nodes, virtual machines, storage, etc.) and their properties (status, memory, CPU, disk, IP address, activity time, snapshot list, etc.) can be retrieved. The plugin also enables you to start and stop VMs and containers, as well as take snapshots and backups. It also features a dedicated health page summarizing all your equipment information."
    es_ES: "Plugin para gestionar un servidor Proxmox. Permite recuperar todos los recursos (nodos, máquinas virtuales, almacenamiento, etc.) y todas sus propiedades (estado, memoria, CPU, disco, dirección IP, tiempo de actividad, lista de instantáneas, etc.). El plugin también permite iniciar y detener máquinas virtuales y contenedores, y realizar instantáneas y copias de seguridad. También dispone de una página de salud dedicada que resume toda la información sobre tus equipos."
    de_DE: "Plugin, das die Verwaltung eines Proxmox-Servers ermöglicht. Es ist möglich, alle Ressourcen (Knoten, virtuelle Maschinen, Speicher...) und alle ihre Eigenschaften (Status, Speicher, CPU, Festplatte, IP-Adresse, Aktivitätszeit, Snapshot-Liste...) abzurufen. Das Plugin ermöglicht auch das Starten und Stoppen von VMs und Containern sowie das Erstellen von Snapshots und Backups. Es verfügt auch über eine spezielle Gesundheitsseite, die alle Informationen über Ihre Geräte zusammenfasst."
