  description:
    fr_FR: "Plugin pour monitorer fail2ban. Il permet de remonter toutes les infos instantanées d'une instance de fail2ban locale ou distante (via SSH) mais il garde également des compteurs journaliers des ip bloquées ainsi qu'un compteur pour pays d'origine (pays récupéré par géolocalisation de l'adresse IP).<br>Il permet également de bannir et de débannir une adresse ip."
    en_US: "Plugin for monitoring fail2ban. It allows you to retrieve all instant info from a local or remote (via SSH) fail2ban instance, but it also keeps daily counters of blocked ip's and a counter for country of origin (country retrieved by geolocating the IP address).<br>It also allows you to ban and unban an ip address."
    es_ES: "Plugin para monitorizar fail2ban. Le permite recuperar toda la información instantánea de una instancia fail2ban local o remota (vía SSH) pero también mantiene contadores diarios de direcciones ip bloqueadas así como un contador para el país de origen (país recuperado geolocalizando la dirección IP).<br>También le permite banear y desbanear una dirección ip."
    de_DE: "Plugin zum Überwachen von fail2ban. Das Plugin ermöglicht es, alle sofortigen Informationen von einer lokalen oder entfernten (über SSH) fail2ban-Instanz zu erhalten, aber es behält auch tägliche Zähler für blockierte IPs und einen Zähler für das Herkunftsland (Land, das durch Geolokalisierung der IP-Adresse abgerufen wird).<br> Es ermöglicht auch, eine IP-Adresse zu verbannen und zu debannern."

