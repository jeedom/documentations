    de_DE: "Dieses Plugin ist für alle iPads und iPhones gedacht, die in Schränken und Schubladen verstauben, die man vergessen oder vernachlässigt hat. Es ermöglicht Ihnen, mit Jeedom zu interagieren, um Informationen zu erhalten, Anwendungen zu starten, Aktionen auszuführen... Weitere Informationen über das Plugin finden Sie unter: https://flobul-domotique.fr/presentation-du-plugin-jailbreak-pour-jeedom/"

