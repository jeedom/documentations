  description:
    fr_FR: "Plugin de supervision d'onduleur (UPS) via le protocole NUT (Network UPS Tools). Connexion en TCP (NUT) ou SSH (via SSH-Manager). Supervise le statut, les tensions et fréquences entrée/sortie, la charge, l'autonomie, les températures batterie/onduleur, la puissance et le minuteur d'arrêt. Génère automatiquement toutes les commandes et supporte différentes actions sur l'onduleur : beeper (activation/désactivation), test batterie, arrêt/redémarrage, etc."
    en_US: "UPS monitoring plugin via the NUT (Network UPS Tools) protocol. Connects via TCP (NUT) or SSH (via SSH-Manager). Monitors status, input/output voltages and frequencies, load, runtime, battery/UPS temperatures, power and shutdown timer. Automatically generates all commands and supports various UPS actions: beeper (enable/disable), battery test, shutdown/reboot, etc."
    es_ES: "Plugin de supervisión de SAI (UPS) mediante el protocolo NUT (Network UPS Tools). Conexión por TCP (NUT) o SSH (a través de SSH-Manager). Supervisa el estado, las tensiones y frecuencias de entrada/salida, la carga, la autonomía, las temperaturas de batería/SAI, la potencia y el temporizador de apagado. Genera automáticamente todos los comandos y soporta diversas acciones sobre el SAI: beeper (activar/desactivar), prueba de batería, apagado/reinicio, etc."
    de_DE: "Plugin zur Überwachung von USV-Geräten (UPS) über das NUT-Protokoll (Network UPS Tools). Verbindung über TCP (NUT) oder SSH (via SSH-Manager). Überwacht Status, Ein-/Ausgangsspannungen und -frequenzen, Last, Laufzeit, Batterie-/USV-Temperaturen, Leistung und Abschalttimer. Erstellt automatisch alle Befehle und unterstützt verschiedene USV-Aktionen: Beeper (ein-/ausschalten), Batterietest, Abschalten/Neustart, usw."
