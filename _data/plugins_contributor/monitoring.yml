  description:
    fr_FR: "UniFi Network - Connexion à un controleur UniFi Network.<br/>Permet certaines actions (Localiser, Gérer LED du site, Mise à jour Firmware, PowerCycle/Activation/Désactivation POE sur switchs, Activation/Désactivation/Reboot des Point d'accès, Activation/Désactivation des WLAN, Bloquer/Débloquer/Gestion présence des clients WiFi, etc)<br/><br/>N'a pas la vocation de remplacer l'interface du controleur<br/><br/>Non supporté : UniFi Protect & UniFi Access & UniFi Talk & UniFi Connect"
    en_US: "UniFi Network - Connect to a UniFi Network controller<br/>Allow some actions (Localization, Manage site LED, Update Firmware, PowerCycle/Enable/Disable POE on switchs, Enable/Disable/Reboot AP, Enable/Disable WLAN's, Block/Unblock/Presence management of Wi-Fi clients, ...)<br/><br/>Does not replace Controller Web Interface<br/><br/>Not supported : UniFi Protect & UniFi Access & UniFi Talk & UniFi Connect<br/><br/>WARNING : Not supported : Debian Buster(10) Stretch(9) Jessie(8) & Jeedom Mini+ & Raspberry Pi 1-2 & Zero (armv6) & i386 (32bits)"
    es_ES: "Red UniFi - Conexión a un controlador de red UniFi.<br/>Permite ciertas acciones (Localizar, Gestionar LED de sitio, Actualizar Firmware, PowerCycle/Activar/Desactivar POE en switches, Activar/Desactivar/Reiniciar Puntos de Acceso, Activar/Desactivar WLANs, Bloquear/Desbloquear/Gestionar presencia de clientes WiFi, etc)<br/><br/>No pretende sustituir a la interfaz del controlador<br/><br/>No soportado: UniFi Protect & UniFi Access & UniFi Talk & UniFi Connect"
    de_DE: "UniFi Network - Verbindung zu einem UniFi Network Controller.<br/>Ermöglicht bestimmte Aktionen (Lokalisieren, Standort-LEDs verwalten, Firmware-Update, PowerCycle/Aktivierung/Deaktivierung von POE auf Switches, Aktivierung/Deaktivierung/Reboot von Access Points, Aktivierung/Deaktivierung von WLANs, Blockieren/Entsperren/Anwesenheitsverwaltung von WiFi-Clients, usw.)<br/><br/>Soll die Controller-Schnittstelle nicht ersetzen<br/><br/>Nicht unterstützt: UniFi Protect & UniFi Access & UniFi Talk & UniFi Connect"
