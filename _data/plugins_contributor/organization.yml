- id: jeeloc
  name: "Jeeloc"
  market_id: 3404
  doc:
    stable:
      fr_FR: "https://zyg0m4t1k.github.io/docs/plugins/jeeloc/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://zyg0m4t1k.github.io/docs/plugins/jeeloc/changelog/"
    beta: false
  description:
    fr_FR: "Jeeloc est un plugin Jeedom de centralisation de localisations. Il ne collecte pas lui-même les coordonnées GPS, mais réutilise des commandes existantes (iOSCloud, Android, coordonnées fixes, etc.) afin de les afficher dans un widget unifié et interactif."
    en_US: "Jeeloc is a Jeedom plugin designed to centralize location data. It does not collect GPS coordinates itself, but reuses existing commands (iOSCloud, Android, fixed coordinates, etc.) to display them in a unified and interactive widget."
    es_ES: "Jeeloc es un plugin de Jeedom para centralizar ubicaciones. No recopila directamente las coordenadas GPS, sino que reutiliza comandos existentes (iOSCloud, Android, coordenadas fijas, etc.) para mostrarlas en un widget unificado e interactivo."
    de_DE: "Jeeloc ist ein Jeedom-Plugin zur Zentralisierung von Standortdaten. Es erfasst keine GPS-Koordinaten selbst, sondern nutzt vorhandene Befehle (iOSCloud, Android, feste Koordinaten usw.), um sie in einem einheitlichen und interaktiven Widget darzustellen."

