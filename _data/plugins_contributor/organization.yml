- id: invoxia
  name: "Invoxia (Linker for GPS Tracker)"
  market_id: 4568
  doc:
    stable:
      fr_FR: "https://www.pasteck.com/plugin-jeedom-linker-for-tracker/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://github.com/mrgreenfr/JeedomPlugins_Docs/blob/master/linkerfortracker/changelog.md"
    beta: false
  description:
    fr_FR: "Plugin permettant la recuperation des données (dont localisations) de vos trackers GPS de la marque Invoxia disponibles ici : https://www.invoxia.com/fr. Vous pourrez visualiser la position actuelle et recuperer l'historique des positions de votre tracker. Les positions GPS sont actualisees toutes les 5 a 10mn par le plugin pour ne pas surcharger les serveurs d'Invoxia (l'actualisation des positions depend aussi de la configuration de votre tracker). Il est interdit de modifier le code du plugin pour reduire le temps d'actualisation des positions (au risque de surcharger les serveurs Invoxia et de vous faire bloquer votre compte par Invoxia). Ce plugin est developpe par un tiers qui n'a pas de lien avec l'entreprise Invoxia. Le developpeur ou Jeedom ne peuvent pas etres tenus responsables de l'arret du fonctionnement du plugin si Invoxia decide de modifier ou supprimer son API ou que le plugin n'est plus compatible avec l'API."
