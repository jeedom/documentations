  changelog:
    stable:
      fr_FR: "https://mips2648.github.io/jeedom-plugins-docs/arlo/fr_FR/changelog"
      en_US: "https://mips2648.github.io/jeedom-plugins-docs/arlo/en_US/changelog"
      es_ES: "https://mips2648.github.io/jeedom-plugins-docs/arlo/es_ES/changelog"
      de_DE: "https://mips2648.github.io/jeedom-plugins-docs/arlo/de_DE/changelog"
    beta:
      fr_FR: "https://mips2648.github.io/jeedom-plugins-docs/arlo/fr_FR/changelog"
      en_US: "https://mips2648.github.io/jeedom-plugins-docs/arlo/en_US/changelog"
      es_ES: "https://mips2648.github.io/jeedom-plugins-docs/arlo/es_ES/changelog"
      de_DE: "https://mips2648.github.io/jeedom-plugins-docs/arlo/de_DE/changelog"
  description:
    fr_FR: "Plugin permettant le contrôle des équipements de la gamme Arlo comme les caméras, la station de base et la sirène intégrée.<br/>Il est possible de contrôler le mode, l'activation et désactivation des caméras, visualiser le flux live des caméras, déclencher des captures et des enregistrements vidéos, déclencher la sirène...<br/>Tous les modèles actuels supportés par l'application Arlo (web ou mobile) sont supportés par le plugin: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell et Video Doorbell..."
    en_US: "Plugin allowing the control of Arlo range equipment such as cameras, base station and integrated siren.<br/>It is possible to control the mode, activation and deactivation of the cameras, view the live stream of the cameras, trigger video captures and recordings, trigger the siren...<br/>All current models supported by the Arlo app (web or mobile) are supported by the plugin: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell and Video Doorbell..."
    es_ES: "Complemento que permite el control de equipos de la gama Arlo como cámaras, estación base y sirena integrada.<br/>Es posible controlar el modo, activación y desactivación de las cámaras, ver la transmisión en vivo de las cámaras, activar capturas y grabaciones de video, activar la sirena...<br/>Todos los modelos actuales compatibles con la aplicación Arlo (web o móvil) son compatibles con el complemento: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell y Video Doorbell..."
    de_DE: "Plug-in zur Steuerung von Geräten der Arlo-Reihe wie Kameras, Basisstation und integrierter Sirene.<br/>Es ist möglich, den Modus, die Aktivierung und Deaktivierung der Kameras zu steuern, den Live-Feed der Kameras anzuzeigen, Videoaufnahmen und -aufzeichnungen auszulösen und die Sirene auszulösen...<br/>Alle aktuellen Modelle, die von der Arlo-Anwendung unterstützt werden (Web oder Mobil), werden vom Plugin unterstützt: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell und Video Doorbell..."

