- id: hikvision
  name: "Hikvision"
  market_id: 3750
  doc:
    stable:
      fr_FR: "https://lunarok.github.io/jeedom_docs/plugins/hikvision/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://lunarok.github.io/jeedom_docs/plugins/hikvision/changelog.html"
    beta: false
  description:
    fr_FR: "ATTENTION, MAJ de mai 2022 : upgrade majeur, veuillez vous référez à la documentation. Ce plugin vise à fournir une intégration complète de vos caméras Hikvision dans Jeedom en autonomie au plugin : visualisation, PTZ, intéractuions Jeedom, notification avec screenshots, récupération des URL RTSP, snap et aussi API Hikvision permettant de récupérer des events détectés par la caméra/NVR. Il fournit également un commande de notification pour envoyer vos screenshots dans les scénarios, l'intégration avec les interactions Jeedom et les assistants vocaux (Google). Vous pouvez trouver aussi les commandes PTZ, Zoom et IR. Ainsi que les flux jpeg, RTSP, MPEG (ce dernier permettant par exemple de streamer vos caméras directement sur des Chromecasts via Google Devices)"
- id: hikvisionevent
  name: "Hikvision Event"
  market_id: 4255
  doc:
    stable:
      fr_FR: "https://loic691.github.io/jeedom_docs/plugins/HikvisionEvent/fr_FR/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://loic691.github.io/jeedom_docs/plugins/HikvisionEvent/fr_FR/changelog"
    beta: false
  description:
    fr_FR: "Ce plugin utilise l'API Hikvision et permet de recevoir tout type d'alarmes intelligentes des périphériques HIKVISION (fielddetection, linedetection, regionentrance, facedetection, accès illégal à l'interface web, problème réseau ou HDD, masquage,...). Il permet aussi de recevoir le type de target détecté (humain ou voiture) sur les caméras compatibles (Acusense par exemple). <br/>Le plugin est compatible avec l'ensemble des caméras et NVR de la marque et marques affiliées. Il gère également de nombreuses autres fonctions : le heartbeat, la réception d'image d'alarme depuis le flux d'alerte (pour les caméras compatibles), le reboot du périphérique, l'activation et désactivation des alarmes par type (linedetection, fieldetectio, VMD,...)  <br/> Découvrez sur la doc les futures fonctionnalités en cours de développement.<br/>L'API est réécrite intégralement car l'autre plugin dispo sur le market utilise une API obsolete."
