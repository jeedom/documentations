  description:
    fr_FR: "Pilotez le plugin Alarme Jeedom depuis vos claviers et télécommandes Zigbee IAS ACE via Zigbee2MQTT : Frient KEPZB, Daewoo WKE502Z, LDESENK09, IKEA SOMRIG et tout appareil IAS ACE (cluster 0x0501).<br/>7 événements configurables (arm, disarm, arm_all_zones, arm_day_zones, arm_night_zones, panic, emergency, tamper), chacun relié à une commande ou un scénario Jeedom. Découverte automatique des équipements Z2M, indicateur de compatibilité temps réel. Aucun démon, aucune dépendance."

