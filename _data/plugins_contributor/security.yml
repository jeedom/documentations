      en_US: "https://mips2648.github.io/jeedom-plugins-docs/arlo/beta/en_US/changelog"
      es_ES: "https://mips2648.github.io/jeedom-plugins-docs/arlo/beta/es_ES/changelog"
      de_DE: "https://mips2648.github.io/jeedom-plugins-docs/arlo/beta/de_DE/changelog"
  description:
    fr_FR: "Plugin permettant le contrôle des équipements de la gamme Arlo comme les caméras, la station de base et la sirène intégrée.<br/>Il est possible de contrôler le mode, l'activation et désactivation des caméras, visualiser le flux live des caméras, déclencher des captures et des enregistrements vidéos, déclencher la sirène...<br/>Tous les modèles actuels supportés par l'application Arlo (web ou mobile) sont supportés par le plugin: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell et Video Doorbell..."
    en_US: "Plugin allowing control of Arlo devices such as cameras, base station and built-in siren.<br/>It is possible to control the mode, activation and deactivation of cameras, view the live stream of cameras, trigger video captures and recordings, trigger the siren...<br/>All current models supported by the Arlo application (web or mobile) are supported by the plugin: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell and Video Doorbell..."
    es_ES: "Plugin para controlar los equipos de la gama Arlo, como las cámaras, la estación base y la sirena integrada.<br/>Es posible controlar el modo, la activación y desactivación de las cámaras, ver la señal en directo de las cámaras, activar la captura y grabación de vídeo, activar la sirena, etc.<br/>Todos los modelos actuales compatibles con la aplicación Arlo (web o móvil) son compatibles con el plugin: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell y Video Doorbell..."
    de_DE: "Plugin, das die Steuerung der Geräte der Arlo-Reihe wie Kameras, Basisstation und integrierte Sirene ermöglicht.<br/>Es ist möglich, den Modus, das Ein- und Ausschalten der Kameras zu steuern, den Live-Stream der Kameras anzuzeigen, Videoaufnahmen und -aufzeichnungen auszulösen, die Sirene auszulösen...<br/>Alle aktuellen Modelle, die von der Arlo-App (Web oder Handy) unterstützt werden, werden auch vom Plugin unterstützt: Arlo, Arlo Pro, Pro2, Pro3, Pro4, Ultra, Arlo Floodlight, Arlo Essential, Arlo Q, Arlo Go, Arlo Baby, Arlo Doorbell und Video Doorbell..."
