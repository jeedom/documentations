    fr_FR: "Le plugin multiRequests est une évolution du plugin Virtuels.<br/><br/>Le plugin Virtual (virtuel) permet la création de périphériques virtuels et de leurs propriétés.<br/><br/>Est ajouté la possibilté de déclencher des actions en fonction d'une valeur.<br/><br/>Exemple: vous etes plusieurs à vouloir allumer ou éteindre une ampoule. Si chacun allume ou éteint l'ampoule sans consulter l'autre, vous aller à un moment ou à un autre vour retrouver dans le noir car l'autre à éteint. Maintenant si un objet represente la requete que vous faites: &quot;allume la lumiere&quot;, qu'un objet prend les requetes de chacun, consolide et prend la bonne action alors vous ne serez plus dans le noir. Il y a plusieurs facons de faire cela dans jeedom: scenario,... ici l'idée est d'avoir tout dans un objet visuel."
