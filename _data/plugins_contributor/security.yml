  description:
    fr_FR: "Ce plugin vous permet d'interagir avec votre alarme Verisure au même titre que l’application officielle “My Verisure”. Il est compatible avec 3 générations de matériels Verisure. Voir la documentation ! Vous retrouverez les principales fonctionnalités de l'application : détail de votre installation / journal d'activité / activation de l'alarme (avec les différents modes : total, jour, nuit, partiel et extérieur) / désactivation de l'alarme / demande d'images. Ce plugin est également compatible avec le plugin Homebridge afin de piloter votre alarme depuis l'application Home d'Apple et/ou depuis Siri."
    en_US: "This plugin lets you interact with your Verisure alarm system just like the official “My Verisure” app. It’s compatible with three generations of Verisure hardware. See the documentation! You’ll find the app’s main features here: installation details / activity log / arming the alarm (with different modes: full, day, night, partial, and outdoor) / disarming the alarm / requesting images. This plugin is also compatible with the Homebridge plugin, allowing you to control your alarm from the Apple Home app and/or via Siri."
    es_ES: "Este complemento te permite interactuar con tu alarma Verisure de la misma forma que la aplicación oficial «My Verisure». Es compatible con tres generaciones de dispositivos Verisure. ¡Consulta la documentación! Encontrarás las principales funciones de la aplicación: detalles de tu instalación, registro de actividad, activación de la alarma (con los distintos modos: total, diurno, nocturno, parcial y exterior), desactivación de la alarma y solicitud de imágenes. Este complemento también es compatible con el complemento Homebridge para controlar tu alarma desde la aplicación Home de Apple y/o desde Siri."
    de_DE: "Mit diesem Plugin können Sie genauso mit Ihrer Verisure-Alarmanlage interagieren wie mit der offiziellen App „My Verisure“. Es ist mit drei Generationen von Verisure-Geräten kompatibel. Siehe Dokumentation! Sie finden hier die wichtigsten Funktionen der App: Details zu Ihrer Anlage / Aktivitätsprotokoll / Aktivierung der Alarmanlage (mit den verschiedenen Modi: Vollalarm, Tag, Nacht, Teilalarm und Außenalarm) / Deaktivierung der Alarmanlage / Bildabfrage. Dieses Plugin ist außerdem mit dem Homebridge-Plugin kompatibel, sodass Sie Ihre Alarmanlage über die Apple Home-App und/oder über Siri steuern können."
