- id: Palazzetti
  name: "Palazzetti"
  market_id: 3104
  doc:
    stable:
      fr_FR: "https://flobul-domotique.fr/presentation-et-configuration-du-plugin-palazzetti-pour-jeedom/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://flobul-domotique.fr/liste-des-versions-du-plugin-palazzetti-pour-jeedom/"
    beta: false
  description:
    fr_FR: "Le plugin Palazzetti permet de piloter les poêles à pellets de la marque Palazzetti au moyen de la passerelle Connection Box, mais aussi les modules PalaControl créés par DomoChip qui simulent une Connection Box. Les fonctionnalités proposées par le plugin sont identiques à celles de l'application mobile officielle Palazzetti App. Un widget simple de pilotage est mis à disposition sur le dashboard, il permet: * d'allumer / éteindre le poêle * de modifier la consigne * de motifier la force de la ventilation * de modifier l'intensité du foyer * de gérer les programmes horaires selon la philosophie du poêle * de visualiser toutes les informations du poêle et de la Connection Box"
    en_US: "The Palazzetti plugin allows you to control Palazzetti pellet stoves by means of the Connection Box gateway, but also the PalaControl modules created by DomoChip that simulate a Connection Box. The functionalities offered by the plugin are identical to those of the official Palazzetti App mobile application. A simple control widget is available on the dashboard, it allows: * turn on/off the stove * change the setpoint * motivate the strength of the ventilation * change the intensity of the fireplace * manage the time programs according to the philosophy of the stove * view all the information of the stove and the Connection Box"
    de_DE: "Das Palazzetti-Plugin ermöglicht die Steuerung von Pelletöfen der Marke Palazzetti über das Gateway Connection Box, aber auch über die von DomoChip erstellten PalaControl-Module, die eine Connection Box simulieren. Die vom Plugin angebotenen Funktionen sind identisch mit denen der offiziellen mobilen Palazzetti App. Ein einfaches Steuerungswidget wird auf dem Dashboard zur Verfügung gestellt, es ermöglicht: * den Ofen ein- und ausschalten * den Sollwert ändern * die Stärke der Lüftung einstellen * die Intensität des Kamins ändern * die Zeitprogramme entsprechend der Philosophie des Ofens verwalten * alle Informationen des Ofens und der Connection Box anzeigen"
    es_ES: "El plugin Palazzetti permite controlar las estufas de pellets Palazzetti mediante la pasarela Connection Box, así como los módulos PalaControl creados por DomoChip que simulan una Connection Box. Las funciones que ofrece el plugin son idénticas a las de la aplicación móvil oficial Palazzetti App. Un sencillo widget de control está disponible en el salpicadero, permitiéndole: * encender y apagar la estufa * cambiar la consigna * ajustar la velocidad del ventilador * cambiar la intensidad del fuego * gestionar los horarios según la filosofía de la estufa * ver toda la información sobre la estufa y la Connection Box"
