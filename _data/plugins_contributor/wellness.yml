- id: clage
  name: "Clage"
  market_id: 4303
  doc:
    stable:
      fr_FR: "https://flobul-domotique.fr/presentation-et-documentation-du-plugin-clage-pour-jeedom/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://flobul-domotique.fr/liste-des-versions-du-plugin-clage-pour-jeedom/"
    beta: false
  description:
    fr_FR: "Le plugin permet de récupérer toutes les informations de son serveur HSX de Clage. Le serveur HSX récupère les informations de ses chauffe-eau connectés parmi MCX 3-7, CEX/CFX, DEX, DSX, DSX Touch, DSX Twin. Les informations qui remontent dans l’application Smart Control (iOS, Android) remontent également dans le plugin. Aucune connexion internet n’est requise pour récupérer ces informations, tout est en local."
    en_US: "The plugin allows you to retrieve all the information from your HSX server from Clage. The HSX server retrieves information from its connected water heaters among MCX 3-7, CEX/CFX, DEX, DSX, DSX Touch, DSX Twin. The information that goes back into the Smart Control app (iOS, Android) also goes back into the plugin. No internet connection is required to retrieve this information, everything is local."
    de_DE: "Mit dem Plugin kann man alle Informationen von seinem HSX-Server von Clage abrufen. Der HSX-Server ruft die Informationen von seinen angeschlossenen Warmwasserbereitern ab, darunter MCX 3-7, CEX/CFX, DEX, DSX, DSX Touch, DSX Twin. Die Informationen, die in der Smart Control App (iOS, Android) aufgerufen werden, werden auch in das Plugin übertragen. Es ist keine Internetverbindung erforderlich, um diese Informationen abzurufen, alles läuft lokal."
    es_ES: "El plugin le permite recuperar toda la información de su servidor Clage HSX. El servidor HSX recupera información de sus calentadores de agua conectados, incluyendo MCX 3-7, CEX/CFX, DEX, DSX, DSX Touch y DSX Twin. La información enviada a la aplicación Smart Control (iOS, Android) también se envía al plugin. No se requiere conexión a Internet para recuperar esta información, todo se hace localmente."
