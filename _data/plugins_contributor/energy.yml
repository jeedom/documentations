- id: iotawatt
  name: "IoTaWatt"
  market_id: 4399
  doc:
    stable:
      fr_FR: "https://flobul-domotique.fr/presentation-et-documentation-du-plugin-iotawatt-pour-jeedom/"
    beta:
      fr_FR: "https://flobul-domotique.fr/presentation-et-documentation-du-plugin-iotawatt-pour-jeedom/"
