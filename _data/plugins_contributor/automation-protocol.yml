    es_ES: "Este plugin te permite controlar tus dispositivos de la Red Homekit (no BLE) en jeedom. El objetivo de este plugin es permitirle controlar los dispositivos que sólo son compatibles con el protocolo Homekit y ningún otro protocolo. ¡Así, por ejemplo, no Philips Hue, que es accesible a través de un plugin dedicado!"
    de_DE: "Mit diesem Plugin können Sie in Jeedom Ihre Homekit-Netzwerkgeräte (keine BLE-Geräte) steuern. Der Zweck dieses Plugins ist es, die Steuerung von Geräten zu ermöglichen, die nur mit dem Homekit-Protokoll und keinem anderen Protokoll kompatibel sind. Also zum Beispiel nicht Philips Hue, das über ein eigenes Plugin zugänglich ist!"

