    es_ES: "Este plugin permite crear un equipo para cada dispositivo identificado en su cuenta ConnectLife. La comunicación se realiza únicamente a través de la API ConnectLife no documentada, no se establece ninguna conexión directa entre Jeedom y el dispositivo. Los comandos generados durante la sincronización dependen del dispositivo (cada dispositivo proporciona su lista de comandos) y también de la información transmitida a través de la API."
