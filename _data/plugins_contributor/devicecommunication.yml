  description:
    fr_FR: "Ce plugin permet de créer un équipement pour chaque vélo identifié sur son compte eBike Flow, eBike Connect ou COBI. La communication se fait uniquement par l'API eBike Flow de Bosch, aucune connexion directe entre Jeedom et le vélo n'est réalisée. Les commandes générées lors de la synchronisation dépendent du vélo et des informations remontées par l'API."
    en_US: "This plugin allows you to create equipment for each bike identified on your eBike Flow, eBike Connect, or COBI account. Communication is only via the eBike Flow API from Bosch; there is no direct connection between Jeedom and the bike. The commands generated during synchronization depend on the bike and the information returned via the API."
    de_DE: "Mit diesem Plugin können Sie für jedes in Ihrem eBike Flow-, eBike Connect- oder COBI-Konto identifizierte Fahrrad eine Ausrüstung erstellen. Die Kommunikation erfolgt ausschließlich über die eBike Flow-API von Bosch, es wird keine direkte Verbindung zwischen Jeedom und dem Fahrrad hergestellt. Die bei der Synchronisierung generierten Befehle hängen vom Fahrrad und den über die API übermittelten Informationen ab."
    es_ES: "Este plugin permite crear un equipo para cada bicicleta identificada en su cuenta eBike Flow, eBike Connect o COBI. La comunicación se realiza únicamente a través de la API eBike Flow de Bosch, no se establece ninguna conexión directa entre Jeedom y la bicicleta. Los comandos generados durante la sincronización dependen de la bicicleta y de la información transmitida a través de la API."
