- id: smartthings
  name: "SmartThings"
  market_id: 4099
  doc:
    stable:
      fr_FR: "https://flobul-domotique.fr/documentation-du-plugin-smartthings-pour-jeedom"
    beta:
      fr_FR: "https://flobul-domotique.fr/documentation-du-plugin-smartthings-pour-jeedom"
  changelog:
    stable:
      fr_FR: "https://flobul-domotique.fr/liste-des-versions-du-plugin-smartthings-pour-jeedom/"
    beta:
      fr_FR: "https://flobul-domotique.fr/liste-des-versions-du-plugin-smartthings-pour-jeedom/"
  description:
    fr_FR: "Ce plugin permet de créer un équipement pour chaque appareil identifié sur son compte SmartThings. La communication se fait uniquement par l'API SmartThings, aucune connexion directe entre Jeedom et l'appareil n'est réalisée. Les commandes générées lors de la synchronisation dépendent de l'appareil (chaque appareil fournit sa liste de commandes), elles dépendent aussi de l'informations remontée via l'API (si la valeur est 'null', la commande n'est pas créée car non mise à jour via l'API ou non gérée). J'ai tout de même laissé une option pour créer l'ensemble des commandes au cas où.</br>Les commandes disponibles varient et peuvent être très nombreuses : afficher l'état de l'appareil, son programme, l'allumer/l'éteindre, changer de chaîne, lancer une programme...</br>J'ai implémenté un widget pour les appareils les plus communs, pour les autres, libre à vous de créer le vôtre, et pourquoi pas le partager."
    en_US: "This plugin allows you to create a device for each device identified on its SmartThings account. The communication is done only through the SmartThings API, no direct connection between Jeedom and the device is made. The commands generated during the synchronization depend on the device (each device provides its list of commands), they also depend on the information sent via the API (if the value is 'null', the command is not created because not updated via the API or not managed). I still left an option to create the set of commands just in case.</br>The available commands vary and can be very numerous: display the status of the device, its program, turn it on/off, change channel, launch a program...</br>I have implemented a widget for the most common devices, for others, free to create your own, and why not share it."
    es_ES: "Este plugin te permite crear un dispositivo para cada electrodoméstico identificado en tu cuenta SmartThings. La comunicación se realiza únicamente a través de la API de SmartThings; no hay conexión directa entre Jeedom y el dispositivo. Los comandos generados durante la sincronización dependen del dispositivo (cada dispositivo proporciona su propia lista de comandos), y también de la información retroalimentada a través de la API (si el valor es 'null', el comando no se crea porque no se ha actualizado a través de la API o no se gestiona). He dejado una opción para crear todos los comandos por si acaso.</br>Los comandos disponibles varían y pueden ser muy numerosos: mostrar el estado del dispositivo, su programa, encenderlo/apagarlo, cambiar de canal, lanzar un programa...</br>He implementado un widget para los dispositivos más comunes, para los demás, eres libre de crear el tuyo propio, y por qué no compartirlo."
    de_DE: "Dieses Plugin ermöglicht es, für jedes Gerät, das über sein SmartThings-Konto identifiziert wurde, eine Ausstattung zu erstellen. Die Kommunikation erfolgt ausschließlich über die SmartThings API, es wird keine direkte Verbindung zwischen Jeedom und dem Gerät hergestellt. Die bei der Synchronisation erzeugten Befehle hängen vom Gerät ab (jedes Gerät liefert seine eigene Befehlsliste), sie hängen auch von den über die API hochgeladenen Informationen ab (wenn der Wert 'null' ist, wird der Befehl nicht erstellt, da er nicht über die API aktualisiert oder nicht verwaltet wird). Die verfügbaren Befehle variieren und können sehr zahlreich sein: den Status des Geräts und sein Programm anzeigen, es ein- und ausschalten, den Kanal wechseln, ein Programm starten...</br> Ich habe ein Widget für die gängigsten Geräte implementiert, für die anderen steht es Ihnen frei, Ihr eigenes Widget zu erstellen und warum nicht auch zu teilen."

