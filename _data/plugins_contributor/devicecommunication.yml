    beta:
      fr_FR: "https://flobul-domotique.fr/liste-des-versions-du-plugin-tasmota-pour-jeedom/"
  description:
    fr_FR: "Ce plugin permet de découvrir, configurer, paramétrer et visualiser les appareils Tasmota et OpenBeken de votre réseau. La découverte utilise plusieurs méthodes paramétrables (ping, ARP, multicast mDNS, autodiscovery MQTT Tasmota). Le plugin ajoute un assistant de commandes dynamique, des vues dédiées pour OpenBeken, la gestion des flags OpenBeken et un mode groupes pour piloter plusieurs équipements simultanément. Compatible avec les plugins MQTT existants de Jeedom (mqtt2, jMQTT). Chaque appareil découvert crée un équipement avec ses commandes automatiquement générées."
    en_US: "This plugin lets you discover, configure, tune and visualize Tasmota and OpenBeken devices on your network. Discovery uses several configurable methods (ping, ARP, mDNS multicast, Tasmota MQTT autodiscovery). The plugin adds a dynamic command assistant, dedicated OpenBeken views, OpenBeken flag management and a group mode to control multiple devices at once. It is compatible with existing Jeedom MQTT plugins (mqtt2, jMQTT). Each discovered device creates an equipment item with automatically generated commands."
    de_DE: "Dieses Plugin ermöglicht das Erkennen, Konfigurieren, Einrichten und Anzeigen von Tasmota- und OpenBeken-Geräten in Ihrem Netzwerk. Die Erkennung verwendet mehrere konfigurierbare Methoden (Ping, ARP, mDNS-Multicast, Tasmota MQTT-Autodiscovery). Das Plugin bietet einen dynamischen Befehlsassistenten, eigene OpenBeken-Ansichten, die Verwaltung von OpenBeken-Flags und einen Gruppenmodus zum gleichzeitigen Steuern mehrerer Geräte. Es ist mit bestehenden Jeedom-MQTT-Plugins (mqtt2, jMQTT) kompatibel. Jedes gefundene Gerät erstellt automatisch eine Ausrüstung mit generierten Befehlen."
    es_ES: "Este plugin permite descubrir, configurar, ajustar y visualizar dispositivos Tasmota y OpenBeken en tu red. El descubrimiento utiliza varios métodos configurables (ping, ARP, multicast mDNS, autodiscovery MQTT de Tasmota). El plugin añade un asistente de comandos dinámico, vistas dedicadas para OpenBeken, gestión de flags OpenBeken y un modo de grupos para controlar varios dispositivos a la vez. Es compatible con los plugins MQTT existentes de Jeedom (mqtt2, jMQTT). Cada dispositivo descubierto crea un equipo con comandos generados automáticamente."
