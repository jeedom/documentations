  description:
    fr_FR: "Ce plugin permet de créer un équipement pour chaque appareil identifié sur son compte hOn. La communication se fait uniquement par l'API non documentée hOn, aucune connexion directe entre Jeedom et l'appareil n'est réalisée. Les commandes générées lors de la synchronisation dépendent de l'appareil (chaque appareil fournit sa liste de commandes), elles dépendent aussi des informations remontées par l'API."
    en_US: "This plugin allows you to create equipment for each device identified on your hOn account. Communication is only via the undocumented hOn API; there is no direct connection between Jeedom and the device. The commands generated during synchronization depend on the device (each device provides its own list of commands) and on the information returned via the API."
    de_DE: "Mit diesem Plugin können Sie für jedes in Ihrem hOn-Konto identifizierte Gerät eine Ausrüstung erstellen. Die Kommunikation erfolgt ausschließlich über die undokumentierte hOn-API, es wird keine direkte Verbindung zwischen Jeedom und dem Gerät hergestellt. Die bei der Synchronisierung generierten Befehle hängen vom Gerät ab (jedes Gerät liefert seine eigene Befehlsliste) und von den über die API übermittelten Informationen."
    es_ES: "Este plugin permite crear un equipo para cada dispositivo identificado en su cuenta hOn. La comunicación se realiza únicamente a través de la API hOn no documentada, no se establece ninguna conexión directa entre Jeedom y el dispositivo. Los comandos generados durante la sincronización dependen del dispositivo (cada dispositivo proporciona su lista de comandos) y también de la información transmitida a través de la API."
