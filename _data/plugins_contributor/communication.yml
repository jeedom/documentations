  description:
    fr_FR: "Exposez Jeedom comme un serveur MCP (Model Context Protocol). Cette fonctionnalité permet aux outils d'intelligence artificielle (Claude Desktop, Cursor, etc.) de découvrir et piloter vos équipements, de consulter leurs états et d'exécuter des commandes et beaucoup d'autres possibilités via une interface standardisée et sécurisée. Vous pouvez également utiliser le plugin « AI Assistant » pour contrôler le MCP directement depuis Jeedom, avec l'IA de votre choix."
    en_US: "Exposes Jeedom as a Model Context Protocol (MCP) server. Enables AI assistants (Claude Desktop, Cursor, etc.) to discover, read and control your home automation devices through a standardised and secure interface."
    es_ES: "Expone Jeedom como un servidor del Protocolo de Contexto del Modelo (MCP). Permite a los asistentes de IA (Claude Desktop, Cursor, etc.) descubrir, leer y controlar sus dispositivos de domótica a través de una interfaz estandarizada y segura."
    de_DE: "Stellt Jeedom als Model Context Protocol (MCP)-Server bereit. Ermöglicht KI-Assistenten (Claude Desktop, Cursor usw.), Ihre Hausautomatisierungsgeräte über eine standardisierte und sichere Schnittstelle zu erkennen, zu lesen und zu steuern."

