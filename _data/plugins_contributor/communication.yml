    fr_FR: "Plugin permettant de créer des commandes de notifications (commande de type action/message) qui se comportent comme une file d'attente et ne délivrent les notifications (envoyées dans leur file respective) que si une condition est remplie. Cela permet de gérer également les doublons et les (non-)répétitions de messages."
    en_US: "Plugin for creating notification commands (action/message type command) that behave like a queue and deliver notifications (sent in their respective queue) only if a condition is met. This also makes it possible to manage message duplication and (non-)repetition."
    es_ES: "Plugin que permite crear comandos de notificación (comandos de tipo acción/mensaje) que se comportan como una cola y sólo entregan notificaciones (enviadas a sus respectivas colas) si se cumple una condición. Esto también permite gestionar la duplicación y (no) repetición de mensajes."
    de_DE: "Plugin zum Erstellen von Benachrichtigungsbefehlen (Befehl vom Typ Aktion/Nachricht), die sich wie eine Warteschlange verhalten und die Benachrichtigungen (die in ihre jeweilige Warteschlange gesendet werden) nur dann ausliefern, wenn eine Bedingung erfüllt ist. Auf diese Weise lassen sich auch doppelte und (nicht) wiederholte Nachrichten verwalten."

