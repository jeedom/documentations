  description:
    fr_FR: "JeeMate est une application mobile disponible pour les appareils Android et wearOS (Play store), iOS (Apple store) et Windows (Microsoft store).Contrôlez facilement votre maison intelligente grâce à son interface intuitive, customisable et l'IA.JeeMate est compatible avec de nombreux plugins Jeedom automatiquement.Ce plugin vous permet de lier l'application mobile à votre Jeedom.JeeMate utilise les types génériques de Jeedom.Notifications, géolocalisation, TTS, Intelligence artificielle, planificateur de scénario, etc... JeeMate vous apporte tout dans une seule application. Le plugin inclut la synchronisation avec Google Fit: créez vos équipements et récupérez vos données de santé."
    es_ES: "JeeMate es una aplicación móvil disponible para dispositivos Android y wearOS (playStore), iOS (Apple store) y Windows (Microsoft store).Controla fácilmente tu casa inteligente con su interfaz intuitiva y personalizable.JeeMate es compatible con muchos plugins Jeedom de forma automática.Este plugin te permite vincular la aplicación móvil a tu Jeedom.JeeMate utiliza tipos genéricos de Jeedom.Notificaciones, geolocalización, TTS, programador de escenarios, etc..... JeeMate te lo trae todo en una sola aplicación.El plugin incluye sincronización con Google Fit: crea tu equipo y recupera tus datos de salud."
    en_US: "JeeMate is a mobile app available for Android and wearOS devices (playStore), iOS (Apple store) and Windows (Microsoft store).Easily control your smart home with its intuitive, customizable interface.JeeMate is compatible with many Jeedom plugins automatically.This plugin lets you link the mobile app to your Jeedom.JeeMate uses generic Jeedom types.Notifications, geolocation, TTS, scenario scheduler, etc.... JeeMate brings you everything in a single application.The plugin includes synchronization with Google Fit: create your equipment and retrieve your health data."
    de_DE: "JeeMate ist eine mobile App, die für Android- und WearOS-Geräte (playStore), iOS (Apple store) und Windows (Microsoft store) erhältlich ist.Steuern Sie Ihr Smart Home ganz einfach über die intuitive und anpassbare Benutzeroberfläche.JeeMate ist mit vielen Jeedom-Plugins automatisch kompatibel.Dieses Plugin ermöglicht es Ihnen, die mobile App mit Ihrem Jeedom zu verbinden.JeeMate nutzt die generischen Typen von Jeedom.Benachrichtigungen, Geolokalisierung, TTS, Szenarioplaner, etc. JeeMate bietet Ihnen alles in einer einzigen Anwendung. Das Plugin beinhaltet die Synchronisation mit Google Fit: Erstellen Sie Ihre Geräte und rufen Sie Ihre Gesundheitsdaten ab."
