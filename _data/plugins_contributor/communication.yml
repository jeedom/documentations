    fr_FR: "Ce plugin va vous permettre de simplifier vos scénarios.<br/>Pour informer un utilisateur, il suffira de demander « Informe Sigalou que la porte du frigo est ouverte »<br/>En effet, en permanence, le plugin saura où est Sigalou (Dans sa voiture, à la maison, à l'extérieur,…), il saura sur quelle tranche horaire on se trouve (Jour, Nuit, …) et plusieurs niveaux de priorité pourront être définis (par exemple : Informe, Notifie, Alerte,…)<br/>Ces informations ne sont pas toutes gérées par Informe, mais Informe les récupère des autres plugins (de localisation, Blea, Jeemate, Présence, Alarme, …)"

