  description:
    fr_FR: "Plugin pour Homebridge.<br/>Passerelle Apple HomeKit pour Jeedom.<br/>Controle de certains périphériques Jeedom par Siri et via application Maison et Eve."
    en_US: "Plugin for Homebridge.<br/>Apple Homekit Gateway for Jeedom.<br/>Control some of your Jeedom equipments via Siri, Home and Eve apps.<br/><br/>WARNING : Not supported : Debian Buster(10) Stretch(9) Jessie(8) & Docker & Jeedom Mini+ & Raspberry Pi 1-2 & Zero (armv6) & i386 (32bits)<br/><br/>Jeedom MUST be on the same network than your iPhone/AppleTV. (no routing, no NAT).<br/><br/>An AppleTV 4+ or iPad iOS 10+(old homekit infra only) or HomePod are mandatory for remote access.<br/><br/>Support on the forum (One request per subject, like a ticket system)."
    es_ES: "Complemento para Homebridge.<br/>Apple Homekit Gateway para Jeedom.<br/>Controla algunos de tus equipos Jeedom a través de las aplicaciones Siri, Home y Eve.<br/><br/>IMPORTANTE : No compatible: Debian Buster(10) Stretch(9) Jessie(8) & Docker & Jeedom Mini + & Raspberry Pi 1-2 & Zero (armv6) y i386 (32bits)<br/><br/>Jeedom DEBE estar en la misma red que su iPhone / AppleTV. (sin enrutamiento, sin NAT).<br/><br/>Se requiere un AppleTV 4+ o un iPad con iOS 10+(Solo infraestructura heredada de homekit) o un HomePod para el acceso remoto.<br/><br/>Soporte en el foro (una solicitud por tema, como un sistema de tickets)."
    de_DE: "Plugin für Homebridge.<br/>Apple Homekit Gateway für Jeedom.<br/>Steuern Sie einige Ihrer Jeedom-Geräte über die Apps Siri, Home und Eve.<br/><br/>WARNUNG: Nicht unterstützt: Debian Buster(10) Stretch(9) Jessie(8) & Docker & Jeedom Mini+ & Raspberry Pi 1-2 & Zero (armv6) & i386 (32bits)<br/><br/>Jeedom MUSS sich im selben Netzwerk wie Ihr iPhone/AppleTV befinden. (kein Routing, kein NAT).<br/><br/>Für den Fernzugriff sind ein AppleTV 4+ oder iPad iOS 10+ (nur alte Homekit-Infrastruktur) oder ein HomePod erforderlich.<br/><br/>Support im Forum (Eine Anfrage pro Thema, wie ein Ticketsystem)."
