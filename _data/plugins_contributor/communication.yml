- id: jeemate
  name: "JeeMate"
  market_id: 4113
  doc:
    stable:
      fr_FR: "https://docs.jeemate.fr/fr/home"
    beta:
      fr_FR: "https://docs.jeemate.fr/fr/home"
  changelog:
    stable:
      fr_FR: "https://docs.jeemate.fr/fr/changelog/plugin"
    beta:
      fr_FR: "https://docs.jeemate.fr/fr/changelog/plugin"
  description:
    fr_FR: "JeeMate est une application mobile disponible pour les appareils Android et wearOS (Play store), iOS (Apple store) et Windows (Microsoft store).<br />Contrôlez facilement votre maison intelligente grâce à son interface intuitive, customisable et l'IA.<br />JeeMate est compatible avec de nombreux plugins Jeedom automatiquement.<br />Ce plugin vous permet de lier l'application mobile à votre Jeedom.<br />JeeMate utilise les types génériques de Jeedom.<br />Notifications, géolocalisation, TTS, Intelligence artificielle, planificateur de scénario, etc... JeeMate vous apporte tout dans une seule application.<br /><br /> Le plugin inclut la synchronisation avec Google Fit: créez vos équipements et récupérez vos données de santé."
    en_US: "JeeMate is a mobile app available for Android and wearOS devices (playStore), iOS (Apple store) and Windows (Microsoft store).<br />Easily control your smart home with its intuitive, customizable interface.<br />JeeMate is compatible with many Jeedom plugins automatically.<br />This plugin lets you link the mobile app to your Jeedom.<br />JeeMate uses generic Jeedom types.<br />Notifications, geolocation, TTS, scenario scheduler, etc.... JeeMate brings you everything in a single application.<br /><br />The plugin includes synchronization with Google Fit: create your equipment and retrieve your health data."
    es_ES: "JeeMate es una aplicación móvil disponible para dispositivos Android y wearOS (playStore), iOS (Apple store) y Windows (Microsoft store).<br />Controla fácilmente tu casa inteligente con su interfaz intuitiva y personalizable.<br />JeeMate es compatible con muchos plugins Jeedom de forma automática.<br />Este plugin te permite vincular la aplicación móvil a tu Jeedom.<br />JeeMate utiliza tipos genéricos de Jeedom.<br />Notificaciones, geolocalización, TTS, programador de escenarios, etc..... JeeMate te lo trae todo en una sola aplicación.<br /><br />El plugin incluye sincronización con Google Fit: crea tu equipo y recupera tus datos de salud."
    de_DE: "JeeMate ist eine mobile App, die für Android- und WearOS-Geräte (playStore), iOS (Apple store) und Windows (Microsoft store) erhältlich ist.<br />Steuern Sie Ihr Smart Home ganz einfach über die intuitive und anpassbare Benutzeroberfläche.<br />JeeMate ist mit vielen Jeedom-Plugins automatisch kompatibel.<br />Dieses Plugin ermöglicht es Ihnen, die mobile App mit Ihrem Jeedom zu verbinden.<br />JeeMate nutzt die generischen Typen von Jeedom.<br />Benachrichtigungen, Geolokalisierung, TTS, Szenarioplaner, etc. JeeMate bietet Ihnen alles in einer einzigen Anwendung.<br /><br /> Das Plugin beinhaltet die Synchronisation mit Google Fit: Erstellen Sie Ihre Geräte und rufen Sie Ihre Gesundheitsdaten ab."

- id: JeeRemi
  name: "JeeRemi"
  market_id: 4614
  doc:
    stable: false
    beta: false
  changelog:
    stable:
      fr_FR: "https://github.com/foireatout/jeedom-jeeremi/doc"
    beta: false
  description:
    fr_FR: "Plugin permettant de gérer les réveils REMI de la marque UrbanHello. Il permet de connaitre et de gérer: le visage affiché, la luminosité de la veilleuse et le volume. Il permet également de jouer/stopper une musique déjà stockée sur l'appareil, de connaitre la température de la pièce et si l'appareil est en ligne."
    en_US: "This plugin allows you to manage REMI alarm clocks from the UrbanHello brand. It lets you view and manage the displayed face, the nightlight brightness, and the volume. It also allows you to play/pause music already stored on the device, check the room temperature, and see if the device is online."
    es_ES: "Este complemento te permite administrar los despertadores REMI de UrbanHello. Te permite ver y administrar la esfera que se muestra, el brillo de la luz nocturna y el volumen. También te permite reproducir/pausar música almacenada en el dispositivo, comprobar la temperatura ambiente y ver si el dispositivo está conectado."
    de_DE: "Dieses Plugin ermöglicht die Steuerung von REMI-Weckern der Marke UrbanHello. Sie können das angezeigte Zifferblatt, die Helligkeit des Nachtlichts und die Lautstärke anpassen. Außerdem können Sie bereits auf dem Gerät gespeicherte Musik abspielen/pausieren, die Raumtemperatur überprüfen und den Online-Status des Geräts einsehen."

