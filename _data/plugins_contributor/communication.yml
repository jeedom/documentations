- id: homebridge
  name: "Homebridge"
  market_id: 2983
  doc:
    stable:
      fr_FR: "https://nebzhb.github.io/jeedom_docs/plugins/homebridge/fr_FR/"
    beta:
      fr_FR: "https://nebzhb.github.io/jeedom_docs/plugins/homebridge/fr_FR/index-beta"
