- id: pimpJeedom
  name: "Pimp my Jeedom"
  market_id: 4005
  doc:
    stable:
      fr_FR: "https://salvialf.github.io/Salvialf-Documentation/pimpJeedom/fr_FR/"
    beta: false
  changelog:
    stable:
      fr_FR: "https://salvialf.github.io/Salvialf-Documentation/pimpJeedom/fr_FR/changelog"
    beta: false
  description:
    fr_FR: "Personnalisez Jeedom en fonction de VOS envies !<br/> Installez facilement les widgets réalisés par Salvialf et les menus de designs réalisés par Noodom et paramétrez les options de personnalisation en quelques clics.<br/> En cas de mise à jour disponible pour un widget un message vous notifie dans Jeedom afin de toujours bénéficier des dernières évolutions.</br> Le plugin inclus également un outil permettant de créer et de gérer les widgets tiers. De nombreuses fonctions sont disponibles : gestion des commandes liées au widget, des paramètres du widget, possibilité d'inclure ou de supprimer des fichiers, éditeur de code et prévisualisation en temps réel.<br/> De nombreuses autres fonctions sont en cours de développement afin de rendre la personnalisation de Jeedom accessible à tout un chacun."

