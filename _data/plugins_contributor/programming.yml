  description:
    fr_FR: "Traducteur/convertisseur d'événements en temps réel : mappe les valeurs d'une commande info source vers des actions Jeedom (commande ou scénario). Mode apprentissage automatique (5 min), aucune dépendance, aucun démon.<br/>Cas d'usage 1 : adapter les valeurs d'un clavier, télécommande ou interrupteur Zigbee/Z-Wave/WiFi vers le plugin Alarme, ArmManager ou tout autre plugin cible — sans scénario.<br/>Cas d'usage 2 : piloter jusqu'à 12 actions distinctes depuis un interrupteur multi-boutons (simple / double / long appui) en quelques clics."

