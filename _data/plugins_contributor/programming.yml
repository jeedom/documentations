      en_US: "https://github.com/Bbillyben/ColorTransition_actuator/blob/master/docs/en_US/changelog.md"
      es_ES: "https://github.com/Bbillyben/ColorTransition_actuator/blob/master/docs/es_ES/changelog.md"
