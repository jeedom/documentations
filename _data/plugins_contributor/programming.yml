  description:
    fr_FR: "Permet de dérouler/mettre en mouvement des transitions de couleurs à partir du plugin ColorTransition sur des commandes, selon un temps défini. Les couleurs sont applicable par la méthode event d'une commande info, par des commande de type message (dans le titre ou le mesage) ou des commande type color. Le plugin permet également d'appeler un scénario avec le tag color. Vous pouvez configurer plusieurs équipements, de différents type, à mettre à jour dans un seul équipement ColorTransform_actuator pour syncrhoniser les transitions."
    en_US: "Allows to run/set in motion color transitions from the ColorTransition plugin on commands, according to a defined time. The colors are applicable by the event method of an info command, by message type commands (in the title or the message) or by color type commands. The plugin also allows to call a scenario with the color tag. You can configure several devices, of different types, to be updated in a single device ColorTransform_actuator to sync the transitions."
    es_ES: "Permite desenrollar/puesta en marcha las transiciones de color del plugin ColorTransition en los comandos, según un tiempo definido. Los colores son aplicables por el método de evento de un comando de información, por comandos de tipo de mensaje (en el título o en el mensaje) o por comandos de tipo de color. El plugin también permite llamar a un escenario con la etiqueta de color. Puede configurar varios dispositivos, de diferentes tipos, para que se actualicen en un único dispositivo ColorTransform_actuator para sincronizar las transiciones."
