- id: ampli_pioneer
  name: "Ampli Pioneer"
  market_id: 2974
  doc:
    stable:
      fr_FR: "https://jeedom.github.io/documentation/third_plugin/ampli_pioneer/fr_FR/index.html"
    beta: false
  changelog:
    stable:
      fr_FR: "https://jeedom.github.io/documentation/third_plugin/ampli_pioneer/fr_FR/index.html#_changelog"
    beta: false
  description:
    fr_FR: "Ce nouveau plugin permet d'exploiter la plupart des commandes de votre ampli.<br/>La communication avec l'ampli se fait via Telnet,<br/>Cela implique donc que, pour fonctionner, votre ampli doit impérativement être connecté au même réseau local que votre box Jeedom ......<br/><br/>Les commandes disponibles sur ces amplis sont très nombreuses, cela va de la sélection des entrées en passant par la configuration des modes sonore (stéréo, DTS,...),et jusqu'au réglages les plus fins de chaque haut-parleur individuellement.<br/><br/>Ajouter les centaines de commandes aurait été trop lourd et compliqué à mettre en œuvre, j'ai donc pris le parti de ne créer que le les commandes essentielles, mais de permettre à chacun de créer toutes les commandes supplémentaires dont il a besoin.<br/><br/>Pour cette raison, j'ai aussi choisi de ne pas créer de tuiles sur mesure pour ce plugin, mais au contraire de vous laisser toute liberté pour organiser votre interface sur le Dashboard avec vos commandes (vous pouvez changer l'ordre des commandes, en créer de nouvelles, et choisir celles que vous souhaitez afficher, et vous avez la possibilité de les personnaliser (notamment avec le plugin Widget)..."
