    fr_FR: "Le nouveau plugin SOMFYUNIFIED incluant TaHomaLocal plus des fonctionnalités plus étendues doit être préféré. Plugin destiné à permettre une interface entre Jeedom et une box Somfy (TaHoma ou équivalente éligible) sur laquelle l'API locale Somfy a été activée. Permet un fonctionnement 'Cloudless' et des retours d'état immédiats.<br> - IMPORTANT - Avant toute chose, bien s'assurer que l'on possède une box Somfy compatible sur laquelle il est possible d'activer sur son compte Somfy le mode Développeur (active l'API Locale). Mots clés: API locale, Somfy, Tahoma, Tahoma Locale"
