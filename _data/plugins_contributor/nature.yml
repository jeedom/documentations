    stable:
      fr_FR: "https://mips2648.github.io/jeedom-plugins-docs/gardena/fr_FR/changelog"
      en_US: "https://mips2648.github.io/jeedom-plugins-docs/gardena/en_US/changelog"
      es_ES: "https://mips2648.github.io/jeedom-plugins-docs/gardena/es_ES/changelog"
