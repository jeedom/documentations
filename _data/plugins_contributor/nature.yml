      es_ES: "https://mips2648.github.io/jeedom-plugins-docs/gardena/beta/es_ES/changelog"
      de_DE: "https://mips2648.github.io/jeedom-plugins-docs/gardena/beta/de_DE/changelog"
  description:
    fr_FR: "Plugin permettant d'intégrer tous les appareils de la gamme Gardena Smart System (Water Control, sensor, irrigation control, power socket et Sileno mower) ce qui permet de controler votre système d'arrosage et votre robot tondeuse ainsi que les robots Husqvarna Automower Connect. Il est possible d'accéder aux données des appareils, de les monitorer et d'effectuer certaine actions en fonction de l'appareil (voir la documentation)."
    en_US: "Plugin for integrating all Gardena Smart System devices (Water Control, sensor, irrigation control, power socket and Sileno mower), enabling you to control your watering system and robotic mower, as well as Husqvarna Automower Connect robots. You can access and monitor device data, and perform certain device-specific actions (see documentation)."
    es_ES: "Plugin para integrar todos los dispositivos Gardena Smart System (Water Control, sensor, control de riego, toma de corriente y cortacésped Sileno) que le permite controlar su sistema de riego y su robot cortacésped, así como los robots Husqvarna Automower Connect. Es posible acceder a los datos de los dispositivos y supervisarlos, así como realizar determinadas acciones en función del dispositivo (consulte la documentación)."
    de_DE: "Plugin zur Integration aller Geräte des Gardena Smart System (Water Control, Sensor, irrigation control, power socket und Sileno mower), mit dem Sie Ihr Bewässerungssystem und Ihren Mähroboter sowie die Husqvarna Automower Connect-Roboter steuern können. Es ist möglich, auf die Daten der Geräte zuzugreifen, sie zu überwachen und bestimmte Aktionen je nach Gerät durchzuführen (siehe Dokumentation)."

